[package]
name = "picker-app"
version = "0.1.0"
description = "Local image management desktop application"
authors = ["Picker contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "picker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
picker-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
ts-rs = "12.0.1"
