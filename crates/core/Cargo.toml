[package]
name = "picker-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Application-independent domain and use-case layer for Picker"

[dependencies]
picker-fswatch = { path = "../fswatch" }
picker-imaging = { path = "../imaging" }
picker-indexer = { path = "../indexer" }
picker-learn = { path = "../learn" }
picker-ml = { path = "../ml" }
picker-sidecar = { path = "../sidecar" }
picker-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
