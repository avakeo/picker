[package]
name = "picker-ml"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Model boundaries and registry for Picker"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
picker-imaging = { path = "../imaging" }
sentencepiece-rs = "0.2.2"
sha2 = "0.10"
ureq = { version = "2", features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "copy-dylibs"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "copy-dylibs"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
